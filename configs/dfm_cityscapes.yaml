experiment:
  name: cs_dfm_cityscapes
  seed: 42
  output_dir: outputs/cs_dfm
dataset:
  name: cityscapes
  root: /home/igarashi_25/datasets/cityscapes
  image_size: [128, 256]
  num_classes: 20
  ignore_index: -100
  augmentation:
    crop_size: [128, 256]
    scale: [0.75, 1.5]
    horizontal_flip: 0.5
    photometric: false
source:
  architecture: segformer
  variant: b2
  num_classes: 20
  pretrained: false
  checkpoint: outputs/source_b2/best.pt
source_cache:
  enabled: true
  root: cache/source_b2
  dtype: float16
  batch_size: 4
  overwrite: false
  verify: true
source_distribution:
  type: image_conditioned
  lambda: 0.2
  temperature: 2.0
  sampling: categorical
flow:
  path:
    type: two_term
    scheduler: power
    power: 2.0
    uniform_strength: 0.3
model:
  base_channels: 64
  channel_mults: [1, 2, 4]
  num_res_blocks: 2
  time_dim: 128
  mask_embed_dim: 64
training:
  stage: dfm
  epochs: 150
  batch_size: 4
  lr: 0.00005
  weight_decay: 0.001
  grad_clip: 1.0
  eta_min: 0.000001
  resume: null
runtime:
  num_workers: 4
  pin_memory: true
  amp: true
  amp_dtype: bf16
distributed:
  enabled: auto
  backend: nccl

