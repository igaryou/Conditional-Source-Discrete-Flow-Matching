experiment: {name: mmseg_conditioned, seed: 42, output_dir: outputs/mmseg_conditioned}
dataset:
  name: cityscapes
  root: /home/igarashi_25/datasets/cityscapes
  pipeline: mmseg
  canonical_size_hw: [1024, 2048]
  num_classes: 20
  void_class_index: 19
  eval_num_classes: 19
  loss_ignore_index: -100
  label_mapping_version: cityscapes_raw_to_19_plus_void_v1
  train_pipeline:
    random_resize: {enabled: true, base_size_hw: [1024, 2048], ratio_range: [0.5, 2.0], keep_ratio: true}
    random_crop: {enabled: true, crop_size_hw: [512, 1024], cat_max_ratio: 0.75, ignore_class_for_ratio: 19, max_attempts: 10}
    horizontal_flip: {probability: 0.5}
    photometric: {enabled: true}
  val_pipeline: {resize_size_hw: [1024, 2048]}
source: {architecture: segformer, variant: b1, initialization: random, checkpoint: outputs/source_mmseg/best.pt}
source_cache: {enabled: false}
source_distribution: {type: image_conditioned, lambda: 0.2, temperature: 2.0, sampling: categorical}
source_runtime: {mode: online}
flow: {path: {type: two_term, scheduler: linear, power: 1.0, uniform_strength: 0.0}}
model: {base_channels: 64, channel_mults: [1, 2, 4], num_res_blocks: 2, time_dim: 128, mask_embed_dim: 64}
training: {stage: dfm, runner: iter, max_iters: 128000, val_interval: 4000, batch_size: 2, lr: 0.00006, weight_decay: 0.01, grad_clip: 1.0, resume: null}
scheduler: {type: poly, power: 1.0, eta_min: 0.0, warmup: {enabled: true, type: linear, begin: 0, end: 1500, start_factor: 0.000001}}
training_budget: {stage1_source_pretraining_updates: 32000, stage2_dfm_updates: 128000, total_updates: 160000, scope: proposal_wide}
validation: {best_metric: generative_mIoU, conditional_interval: 4000, generative_interval: 20000, generative_steps: 20, generative_seed: 42, num_source_samples: 1, argmax_final: false}
evaluation: {generative_steps: 20, seed: 42, num_source_samples: 1, argmax_final: false}
runtime: {num_workers: 4, pin_memory: true, amp: true, amp_dtype: bf16}
distributed: {enabled: auto, backend: nccl}
